name: Compilar APK Android para GreenAir QC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK nativo con Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Subir APK v1 generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: GreenAir-QC-v1.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
